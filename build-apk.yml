name: Build StoryCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          mkdir android-src
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP_FILE" || exit 1
          unzip "$ZIP_FILE" -d android-src

      - name: Build APK
        run: |
          WRAPPER=$(find android-src -name gradlew -type f | head -n 1)
          test -n "$WRAPPER" || exit 1
          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StoryCraft-Android-APK
          path: android-src/**/build/outputs/apk/debug/*.apk
